workflows:
  android-apk:
    name: Velvet Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Android layihəsini yarat
        script: flutter create --platforms=android --project-name velvet_app --org com.velvet .
      - name: İnternet icazəsi (şəkillər üçün)
        script: |
          perl -0pi -e 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/ unless \/android.permission.INTERNET\/' android/app/src/main/AndroidManifest.xml
      - name: Paketlər
        script: flutter pub get
      - name: APK yığ
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
