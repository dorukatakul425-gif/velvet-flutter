workflows:
  android-apk:
    name: Velvet Android APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      groups: [velvet_config]
      android_signing:
        - velvet_keystore
    scripts:
      - name: Android projesini oluştur
        script: flutter create --platforms=android --project-name velvet_app --org com.velvet .
      - name: Android izinlerini ve giriş bağlantısını ekle
        script: |
          M=android/app/src/main/AndroidManifest.xml
          perl -0pi -e 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application|' "$M"
          perl -0pi -e 's|(<category android:name="android.intent.category.LAUNCHER"\s*/>\s*</intent-filter>)|$1\n            <intent-filter>\n                <action android:name="android.intent.action.VIEW"/>\n                <category android:name="android.intent.category.DEFAULT"/>\n                <category android:name="android.intent.category.BROWSABLE"/>\n                <data android:scheme="com.velvet.app" android:host="login-callback"/>\n            </intent-filter>|' "$M"
      - name: Firebase ekle
        script: |
          cp google-services.json android/app/google-services.json
          flutter pub add firebase_core firebase_messaging "flutter_local_notifications:^18.0.0"
          python3 - <<'PY'
          p = 'android/settings.gradle.kts'
          s = open(p).read()
          s = s.replace('id("com.android.application")', 'id("com.google.gms.google-services") version "4.4.2" apply false\n    id("com.android.application")', 1)
          open(p, 'w').write(s)
          p = 'android/app/build.gradle.kts'
          s = open(p).read()
          s = s.replace('id("com.android.application")', 'id("com.android.application")\n    id("com.google.gms.google-services")', 1)
          s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
          s = s.replace('multiDexEnabled = true\n', '')
          s = s.replace('defaultConfig {', 'defaultConfig {\n        multiDexEnabled = true', 1)
          if 'coreLibraryDesugaring' not in s:
              s = s.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")', 1)
          if 'isCoreLibraryDesugaringEnabled' not in s:
              s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
          open(p, 'w').write(s)
          PY
      - name: Release imzalamasını ayarla
        script: |
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
          python3 - <<'PY'
          p = 'android/app/build.gradle.kts'
          s = open(p).read()
          s = 'import java.util.Properties\nimport java.io.FileInputStream\n\n' + s
          s = s.replace('android {', 'val keystoreProperties = Properties().apply {\n    load(FileInputStream(rootProject.file("key.properties")))\n}\n\nandroid {', 1)
          s = s.replace('buildTypes {', 'signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String\n            keyPassword = keystoreProperties["keyPassword"] as String\n            storeFile = file(keystoreProperties["storeFile"] as String)\n            storePassword = keystoreProperties["storePassword"] as String\n        }\n    }\n    buildTypes {', 1)
          s = s.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")')
          open(p, 'w').write(s)
          PY
      - name: Paketleri temizle ve yükle
        script: |
          flutter clean
          flutter pub get
      - name: APK derle
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
