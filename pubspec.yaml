name: velvet_app

description: Velvet — gerçek zamanlı sosyal sesli sohbet uygulaması

publish_to: "none"

version: 1.1.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  livekit_client: ^2.4.7
  permission_handler: ^11.3.1
  supabase_flutter: ^2.8.0

  # Hediye animasyonları için eklendi:
  video_player: ^2.9.2      # MP4 animasyonları oynatır (ses dahil)
  audioplayers: ^6.1.0      # İsteğe bağlı: ayrı ses efektleri için

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Animasyon videoları ve hediye ikonları buradan yüklenir.
  # ZIP'teki mp4 ve png dosyalarını projenizde assets/gifts/ klasörüne koyun.
  assets:
    - assets/gifts/
