name: velvet_app
description: Velvet — gerçek zamanlı sosyal sesli sohbet uygulaması
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  livekit_client: ^2.4.7
  permission_handler: ^11.3.1
  supabase_flutter: ^2.8.0
  flutter_svg: ^2.0.10
  app_links: ^6.0.0
  image_picker: ^1.0.7

  # Hediye animasyonları için eklendi:
  video_player: ^2.9.2
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/gifts/
